name: CI

# Fast → slow gate on every PR and on pushes to main/develop and work branches.
# Ordered so a cheap failure (typecheck) short-circuits before the expensive
# build. It used to run only for main, so develop/feat branches reached a
# Vercel Preview without typecheck/tests/guard (AUDIT H6).
# See .docs/TESTING.md §"Forma del pipeline de CI".
on:
  pull_request:
  push:
    branches: [main, develop, "feat/**", "fix/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs `postinstall` (prisma generate), which needs the schema
      # but no database connection.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (capa 1) — TZ=UTC
        run: npm test

      - name: Unit tests (capa 1) — TZ=AR (detecta dependencias del host)
        run: npm run test:tz-ar

      # Static tenant-isolation guard: fails if a tenantId model loses its RLS
      # policy or an Actor-facing module calls prisma directly without runWithRls.
      # It was only ever run by hand — a green local run proved nothing about PRs.
      - name: Guard de aislamiento por tenant
        run: npm run guard:isolation

      - name: Build
        run: npm run build
        env:
          # Build-time env: real secrets are injected in Vercel, not here. These
          # placeholders only need to be syntactically valid for the build.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # VX F-e (C-F6): JS inicial por ruta, con presupuesto por grupo (scripts/bundle-groups.mjs): públicas ≤ 120 kB,
      # turnero ≤ 135, portal ≤ 125, onboarding ≤ 160, Plataforma ≤ 180 y workspace ≤ 180. TODOS bloquean (exit 1 si
      # exceden o crecen > 10 % sobre scripts/bundle-baseline.json).
      # Públicas/turnero/portal bloquean desde F-Z (15-oct); onboarding, Plataforma y workspace desde PF1-Z (16-oct,
      # D-PF-B), cuando todas sus rutas entraron (máx. /agenda 175,7, /pacientes/[id] 171,7); baseline regrabado ahí.
      - name: Presupuesto de bundle
        run: node scripts/check-bundle-budget.mjs

  # Capa 3 (A1.1): integración contra Postgres real, con las server actions
  # REALES y dos corridas: el rol app `kinesoft_app` (RLS aplicada) y el owner
  # con BYPASSRLS, que es como corre producción hasta el flip de RLS.
  # Solo credenciales del Postgres efímero del runner: nada de secretos.
  integration:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinesoft
          POSTGRES_PASSWORD: kinesoft
          POSTGRES_DB: kinesoft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinesoft -d kinesoft"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OWNER_URL: postgresql://kinesoft:kinesoft@localhost:5432/kinesoft?schema=public
      APP_URL_DB: postgresql://kinesoft_app:kinesoft_app@localhost:5432/kinesoft?schema=public
      TZ: UTC
      INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Migraciones (owner)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
      - name: Rol de app sin BYPASSRLS
        run: psql "postgresql://kinesoft:kinesoft@localhost:5432/kinesoft" -v ON_ERROR_STOP=1 -f prisma/roles.local.sql
      - name: Integración con RLS (kinesoft_app)
        run: npx vitest run -c vitest.integration.config.ts
        env:
          DATABASE_URL: ${{ env.APP_URL_DB }}
          DIRECT_URL: ${{ env.OWNER_URL }}
      - name: Integración como prod hoy (owner BYPASSRLS)
        run: npx vitest run -c vitest.integration.config.ts
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
