<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48">
  <!-- [PV BR-a] Favicon = logo «A · Sello C» (components/ui/kine-logo.tsx, design_source/brand/index.html) con hex
       literales: un favicon no lee variables CSS (sky-700 → sky-500, lime-300 de la paleta por defecto). Radio 11/48 y
       glifo al 84 %: a 16 px no sobra nada, así que el glifo ocupa casi toda la baldosa (escala del favicon del diseño). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fbe"/>
      <stop offset="1" stop-color="#5e92cc"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#g)"/>
  <g transform="translate(24 24) scale(.84) translate(-24.6 -24)">
    <path d="M30.88 14.17 A12 12 0 1 0 30.88 33.83" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="36" cy="24" r="4.4" fill="#c8f564"/>
  </g>
</svg>
