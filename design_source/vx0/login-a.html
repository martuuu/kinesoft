<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · KineSoft (A)</title>
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  /* A · card centrada. Lo más simple: no hay columna que quede vacía a
     ningún ancho, porque no hay columnas. */
  body { background: var(--bg-public); }
  .page { min-height: 100dvh; display: grid; grid-template-rows: 1fr auto; }
  main { display: grid; place-items: center; padding: clamp(24px, 6vh, 72px) 16px; }
  .wrap { width: 100%; max-width: 440px; display: grid; gap: 28px; justify-items: center; }
  .foot { padding: 20px 16px 28px; text-align: center; font-size: 14px; color: var(--navy-500); }
  .foot a { display: inline-flex; align-items: center; min-height: 44px; }
  @media (max-width: 479px) {
    main { place-items: start center; padding-top: 24px; }
    .auth-card { padding: 24px 20px; border-radius: var(--r-lg); }
  }
</style>
</head>
<body>
<div class="page">
  <main id="main">
    <div class="wrap">
      <div class="enter-fade" data-include="logo"></div>
      <div class="auth-card enter enter-d1"><div data-include="login-form"></div></div>
    </div>
  </main>
  <footer class="foot">© 2026 KineSoft · <a class="link" href="landing-b.html">Conocé KineSoft</a></footer>
</div>
</body>
</html>
