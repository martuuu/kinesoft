# Local dev fallback only. Production uses Supabase (see .env / .env.local).
#
# Boot:   docker compose up -d db
# Stop:   docker compose down
# Reset:  docker compose down -v   (wipes the volume)
#
# When using Supabase (the default since Sprint 10), leave this down. Only
# bring it up if you need to develop completely offline — point your
# DATABASE_URL/DIRECT_URL at localhost:5433 in `.env.local` and re-run
# `npx prisma migrate deploy && npm run prisma:seed`.

services:
  db:
    image: postgres:16-alpine
    container_name: kinesoft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinesoft
      POSTGRES_PASSWORD: kinesoft
      POSTGRES_DB: kinesoft
    ports:
      # Host port 5433 → container port 5432. Avoids clashes with any
      # other Postgres you've got running on the default 5432.
      - "5433:5432"
    volumes:
      - kinesoft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kinesoft", "-d", "kinesoft"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: kinesoft-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # IAM-0b · buzón local para ver los mails de la app (invitaciones, reset,
  # portal) tal como llegan, sin mandar nada afuera. Perfil opcional: NO se
  # levanta con `docker compose up -d db` ni con un `up` pelado.
  #   docker compose --profile mail up -d mailpit
  #   UI: http://localhost:8025 · en .env.local: EMAIL_TRANSPORT="mailpit"
  # La app le habla por la API HTTP (POST /api/v1/send, lib/email/mailpit.ts);
  # el SMTP (1025) queda publicado por si otra herramienta lo necesita.
  # Sin volumen: los mails viven en memoria y se pierden al bajarlo (a propósito).
  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: kinesoft-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  kinesoft_pgdata:
